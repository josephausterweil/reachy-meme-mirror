<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meme Mirror</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e2e0db;
  --accent: #3a5bd9; --accent-ink: #ffffff; --good: #2e7d4f; --warn: #a15c00; --bad: #b3261e;
  --lib: #6d4bc4; --own: #1f7a8c; --binh: #b0532a; --chip: #efede8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141416; --panel: #1d1d20; --ink: #ececef; --muted: #9a9aa2; --line: #2e2e33;
    --accent: #7d97ff; --accent-ink: #0d0d10; --good: #6fcf97; --warn: #f2b25c; --bad: #ff8a80;
    --lib: #b39dff; --own: #6fd3e3; --binh: #ffab85; --chip: #2a2a2f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line);
  background: var(--panel); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 18px; margin: 0; }
#robot { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.ok { background: var(--good); } .dot.no { background: var(--bad); }
main { display: grid; grid-template-columns: 260px 1fr; gap: 20px; padding: 20px; max-width: 1500px; margin: 0 auto; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
button, .btn { font: inherit; border: 1px solid var(--line); background: var(--chip); color: var(--ink);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: progress; }
input[type=number] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px; }
textarea, input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
textarea { min-height: 60px; resize: vertical; }
#drop { border: 2px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; color: var(--muted);
  cursor: pointer; }
#drop.over { border-color: var(--accent); color: var(--accent); }
#sessions { list-style: none; padding: 0; margin: 12px 0 0; }
#sessions li { padding: 7px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
#sessions li:hover, #sessions li.active { background: var(--chip); }
#sessions small { color: var(--muted); display: block; }
.top { display: grid; grid-template-columns: minmax(180px, 320px) 1fr; gap: 16px; }
@media (max-width: 860px) { .top { grid-template-columns: 1fr; } }
.top img { width: 100%; border-radius: 10px; border: 1px solid var(--line); }
.field { margin-bottom: 8px; } .field label { font-size: 12px; color: var(--muted); display: block; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.round-head { margin: 22px 0 10px; display: flex; align-items: baseline; gap: 10px; }
.round-head h3 { margin: 0; font-size: 16px; } .round-head span { color: var(--muted); font-size: 13px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  display: flex; flex-direction: column; }
.card.picked { outline: 2px solid var(--good); }
button.fit.on { background: var(--good); color: #fff; border-color: var(--good); }
.card video { width: 100%; aspect-ratio: 1; object-fit: cover; background: #23324a; display: block; }
.card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
.card h4 { margin: 0; font-size: 15px; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; color: #fff; }
.badge.library { background: var(--lib); } .badge.own { background: var(--own); } .badge.binh { background: var(--binh); }
.small { font-size: 13px; color: var(--muted); }
.scores { display: flex; gap: 10px; font-size: 13px; }
.meter { flex: 1; height: 6px; background: var(--chip); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; background: var(--accent); }
.stars button { border: none; background: none; padding: 0 1px; font-size: 20px; color: var(--muted); }
.stars button.on { color: #e6a700; }
details summary { cursor: pointer; font-size: 13px; color: var(--muted); }
.dials { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: center; font-size: 13px; }
.warn { color: var(--warn); font-size: 13px; } .err { color: var(--bad); font-size: 13px; }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink);
  padding: 18px; width: min(560px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog select, dialog input[type=text], dialog input[type=password] { width: 100%; font: inherit; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
.ok { color: var(--good); font-size: 13px; }
.media { position: relative; }
.media img.strip { width: 100%; display: block; background: #1f2d44; aspect-ratio: 1; object-fit: contain; }
.media .btn3d { position: absolute; right: 8px; bottom: 8px; background: rgba(10,14,24,.75); color: #fff;
  border: 1px solid rgba(255,255,255,.25); }
#viewer3d { position: fixed; right: 16px; bottom: 16px; width: min(440px, calc(100vw - 32px)); z-index: 8;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  box-shadow: 0 16px 40px rgba(0,0,0,.35); display: none; }
#viewer3d.open { display: block; }
#viewer3d .head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 13px; }
#viewer3d .head span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#viewer3d iframe { width: 100%; height: min(440px, 70vh); border: 0; display: block; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; font-size: 14px; display: none; z-index: 9; max-width: 90vw; }
.busy { color: var(--muted); font-size: 14px; padding: 12px 0; }
.empty { color: var(--muted); padding: 40px; text-align: center; }
code { font-size: 12px; word-break: break-word; }
</style>
</head>
<body>
<header>
  <h1>Meme Mirror</h1>
  <span class="small">meme → Reachy expression</span>
  <div id="robot"><span class="dot" id="rdot"></span><span id="rtext">checking Reachy…</span>
    <button id="sleepBtn" title="Put Reachy to sleep">Sleep</button>
    <button id="llmBtn" title="Choose which AI model to use">⚙ LLM</button></div>
</header>
<main>
  <aside>
    <div class="panel">
      <h2>New meme</h2>
      <div id="drop">Drop or paste a meme image here, or click to choose a file</div>
      <input type="file" id="file" accept="image/*" hidden>
      <div class="field" style="margin-top:8px">
        <textarea id="newNotes" placeholder="Optional: what it means to you, or how Reachy might show it"></textarea>
      </div>
      <h2 style="margin-top:14px">Sessions</h2>
      <ul id="sessions"></ul>
    </div>
  </aside>
  <section id="main"><div class="empty">Drop a meme to start.</div></section>
</main>
<div id="toast"></div>
<div id="viewer3d"><div class="head"><span id="v3dTitle">3D preview</span>
  <button id="v3dClose" title="Close the 3D preview (Esc)">✕ Close</button></div>
  <iframe id="v3dFrame" title="3D preview of the robot"></iframe></div>
<dialog id="llmDlg">
  <h2 style="margin-top:0">Which AI model?</h2>
  <div class="field"><label>Provider</label><select id="llmPreset"></select></div>
  <p class="small" id="llmHelp"></p>
  <div class="field" id="llmKeyRow"><label id="llmKeyLabel">API key</label>
    <input type="password" id="llmKey" autocomplete="off" placeholder="paste your key">
    <div class="small">Stored only on this computer (secrets.local.toml), never in the repo.</div></div>
  <div class="field" id="llmUrlRow"><label>Server address (…/v1)</label><input type="text" id="llmUrl"></div>
  <div class="field"><label>Main model: reads the meme and writes expressions (must accept images)</label>
    <input type="text" id="llmMain" list="llmModels"></div>
  <div class="field"><label>Fast model: blind judge, grader, lessons (accept images; blank = main model)</label>
    <input type="text" id="llmFast" list="llmModels"></div>
  <datalist id="llmModels"></datalist>
  <div class="small" id="llmModelsNote"></div>
  <div class="small warn" id="llmOverrides"></div>
  <div class="row" style="margin-top:12px">
    <button id="llmLoad">List models</button><span style="flex:1"></span>
    <button id="llmTest">Test</button><button class="primary" id="llmSave">Save</button><button id="llmClose">Close</button>
  </div>
  <div id="llmResult" class="small" style="margin-top:10px"></div>
</dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S = null;  // current session
let L = null;  // what the proposer has learned (stats, suggested mix, lessons)

function toast(msg, ms = 3500) { const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", ms); }

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch {} throw new Error(m); }
  return r.json();
}
const post = (path, body) => api(path, {method: "POST", headers: {"content-type": "application/json"},
                                        body: JSON.stringify(body || {})});

// ----- sessions list / upload -----
async function loadSessions() {
  const list = await api("/api/sessions");
  $("#sessions").innerHTML = list.map(s => `<li data-id="${esc(s.id)}" class="${S && S.id === s.id ? "active" : ""}">
    ${esc(s.core_emotion || "(reading…)")}<small>${esc(s.id)} · ${s.n_candidates} tried</small></li>`).join("");
}
$("#sessions").onclick = e => { const li = e.target.closest("li"); if (li) openSession(li.dataset.id); };

async function upload(file) {
  const fd = new FormData(); fd.append("meme", file); fd.append("notes", $("#newNotes").value);
  $("#main").innerHTML = `<div class="busy">Reading the meme…</div>`;
  try { S = await api("/api/sessions", {method: "POST", body: fd}); $("#newNotes").value = "";
        render(); loadSessions(); }
  catch (e) { $("#main").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
const drop = $("#drop");
drop.onclick = () => $("#file").click();
$("#file").onchange = e => e.target.files[0] && upload(e.target.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over");
  const f = e.dataTransfer.files[0]; if (f) upload(f); };
window.addEventListener("paste", e => { const f = [...e.clipboardData.files].find(f => f.type.startsWith("image/"));
  if (f) upload(f); });

async function openSession(id) {
  S = await api(`/api/sessions/${id}`); render(); loadSessions();
  history.replaceState(null, "", `?session=${encodeURIComponent(id)}`); }

// ----- main view -----
const READING_FIELDS = [["core_emotion", "Core emotion"], ["nuance", "Nuance"], ["arc", "How it unfolds"],
                        ["text_prompt", "Text-to-motion prompt"]];

// Notes typed but not yet saved survive any re-render (rounds finishing, robot playback finishing, ...).
function captureDrafts() {
  const d = {cards: {}};
  document.querySelectorAll(".card[data-cid]").forEach(card => {
    const t = $("textarea", card); if (t) d.cards[card.dataset.cid] = t.value; });
  const notes = $("#notes"); if (notes) d.notes = notes.value;
  document.querySelectorAll("textarea[data-k]").forEach(t => (d.reading ||= {})[t.dataset.k] = t.value);
  d.sid = S && S.id;
  return d;
}
function restoreDrafts(d) {
  if (!d || !S || d.sid !== S.id) return;
  for (const [cid, text] of Object.entries(d.cards)) {
    const c = S.candidates.find(x => x.id === cid);
    const t = document.querySelector(`.card[data-cid="${cid}"] textarea`);
    if (t && c && text !== ((c.feedback || {}).comment || "")) t.value = text;
  }
  if (d.notes != null && $("#notes") && d.notes !== (S.notes || "")) $("#notes").value = d.notes;
  for (const [k, v] of Object.entries(d.reading || {})) {
    const t = document.querySelector(`textarea[data-k="${k}"]`);
    if (t && v !== String((S.reading || {})[k] ?? "")) t.value = v;
  }
}

function render() {
  if (!S) return;
  const drafts = captureDrafts();
  renderMain();
  restoreDrafts(drafts);
}

function renderMain() {
  const r = S.reading || {};
  const rounds = {};
  S.candidates.forEach(c => (rounds[c.round] ||= []).push(c));
  $("#main").innerHTML = `
    <div class="panel top">
      <img src="/files/${S.id}/${S.meme}" alt="meme">
      <div>
        <h2>What the meme expresses ${r.meme_template ? `· <span class="small">${esc(r.meme_template)}</span>` : ""}</h2>
        <p class="small" style="margin-top:0">${esc(r.depicts)}</p>
        ${S.animation ? `<p class="small">Animated: ${S.animation.frames} frames, ${S.animation.seconds}s per loop. The model saw
          <a href="/files/${S.id}/meme_frames.png" target="_blank">these frames</a>.</p>` : ""}
        ${READING_FIELDS.map(([k, label]) => `<div class="field"><label>${label}</label>
          <textarea data-k="${k}" rows="${k === "core_emotion" ? 1 : 2}">${esc(r[k])}</textarea></div>`).join("")}
        <div class="small">Cues: ${esc((r.bodily_cues || []).join("; "))} · valence ${r.valence} · arousal ${r.arousal} · confidence ${esc(r.confidence)}</div>
        <div class="field" style="margin-top:8px"><label>Your notes on the emotion, or how Reachy might express it (used in every round)</label>
          <textarea id="notes">${esc(S.notes)}</textarea></div>
        <div class="row">
          <button id="saveReading">Save edits</button>
          <button id="reread" title="Ask the model to read the meme again using your notes">Re-read meme with notes</button>
          <span style="flex:1"></span>
          <label class="small">library <input type="number" id="nLib" value="${mixOf("library", 1)}" min="0" max="3" style="width:42px"></label>
          <label class="small">own <input type="number" id="nOwn" value="${mixOf("own", 1)}" min="0" max="3" style="width:42px"></label>
          <label class="small">binh <input type="number" id="nBinh" value="${mixOf("binh", 2)}" min="0" max="3" style="width:42px"></label>
          <span id="binhNote" class="small"></span>
          <button class="primary" id="improve" ${hasFeedback() ? "" : "disabled"}
            title="New candidates built from all your ratings and notes on this meme (rate or note something first)">Improve from my feedback</button>
          <button id="propose">${S.candidates.length ? "Try new ways" : "Propose expressions"}</button>
        </div>
        <div id="learnedBox">${learnedHtml()}</div>
      </div>
    </div>
    <div id="rounds">${Object.keys(rounds).sort((a, b) => b - a).map(n => roundHtml(n, rounds[n])).join("")}</div>`;
  bindMain();
}

const mixOf = (src, dflt) => L && L.suggested_mix ? L.suggested_mix[src] : dflt;

function learnedHtml() {
  if (!L) return "";
  if (!L.n_rated) return `<p class="small" style="margin:10px 0 0">Learning: nothing yet. Stars, notes, and the ones you
    play or save teach it your taste across memes.</p>`;
  const st = L.stats, srcs = ["library", "own", "binh"];
  const cell = s => `<span class="badge ${s}">${s}</span> ${st[s].mean ?? "–"}★ <span class="small">(n=${st[s].n}${st[s].picked ? `, good fit ${st[s].picked}` : ""}${st[s].saved ? `, saved ${st[s].saved}` : ""}${st[s].match != null ? `, blind match ${Math.round(st[s].match*100)}%` : ""})</span>`;
  return `<details style="margin-top:10px"><summary>What it has learned from ${L.n_rated} rated expressions
      (mix suggests ${srcs.map(s => `${L.suggested_mix[s]} ${s}`).join(", ")})</summary>
    <div class="row" style="gap:14px;margin:8px 0">${srcs.map(cell).join("")}</div>
    ${L.lessons && L.lessons.length ? `<ul class="small" style="margin:4px 0 0;padding-left:18px">${L.lessons.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`
      : `<div class="small">${L.lessons === null ? "Lessons loading…" : "Lessons appear after 3 rated expressions."}</div>`}
  </details>`;
}

function showLearning() {
  const box = $("#learnedBox"); if (!box) return;
  const open = box.querySelector("details")?.open;
  box.innerHTML = learnedHtml();
  if (open) box.querySelector("details").open = true;
  [["nLib", "library"], ["nOwn", "own"], ["nBinh", "binh"]].forEach(([id, src]) => {
    const el = $("#" + id); if (el && !el.dataset.touched && L.suggested_mix) el.value = L.suggested_mix[src]; });
}

async function binhStatus() {
  const box = $("#binhNote"); if (!box) return;
  try {
    const b = await api("/api/binh");
    if (b.available) { box.textContent = ""; return; }
    if (b.state === "installing") { box.textContent = "installing PyTorch…"; setTimeout(binhStatus, 5000); return; }
    box.innerHTML = `${b.state === "failed" ? "install failed · " : ""}binh needs PyTorch
      <button id="binhInstall" title="Installs the CPU build of PyTorch here (~0.9 GB)">Install</button>`;
    $("#binhInstall").onclick = async () => {
      if (!confirm("Install PyTorch (CPU build, about 0.9 GB) so learned 'binh' motion can be generated here?")) return;
      try { await post("/api/binh/install"); binhStatus(); } catch (e) { toast(e.message, 6000); } };
  } catch {}
}

async function loadLearning() {
  try { L = await api("/api/learning?lessons=false"); showLearning();
        L = await api("/api/learning"); showLearning(); } catch {}
}

function roundHtml(n, cands) {
  const c0 = cands[0];
  const how = c0.mode === "more_like" ? `more like ${esc(c0.anchor)}` : c0.mode === "feedback" ? "improved from your feedback" : "new ways";
  return `<div class="round-head"><h3>Round ${n}</h3><span>${how}${c0.notes ? ` · “${esc(c0.notes)}”` : ""}</span></div>
          <div class="cards">${cands.map(cardHtml).join("")}</div>`;
}

function cardHtml(c) {
  const fb = c.feedback || {};
  const stars = [1,2,3,4,5].map(i => `<button data-act="rate" data-v="${i}" class="${(fb.rating||0) >= i ? "on" : ""}">★</button>`).join("");
  const what = c.spec ? JSON.stringify(c.spec) : c.recipe;
  const d = c.dials || {speed: 1, amplitude: 1};
  return `<div class="card ${fb.picked ? "picked" : ""}" data-cid="${c.id}">
    <div class="media">
      ${c.video ? `<video src="/files/${S.id}/${c.video}?v=${encodeURIComponent(JSON.stringify(d))}" muted loop autoplay playsinline></video>`
        : (c.thumb || c.strip) ? `<img class="strip" src="/files/${S.id}/${c.thumb || c.strip}?v=${encodeURIComponent(JSON.stringify(d))}" alt="drawn frames of the motion">` : ""}
      ${c.move_file ? `<button class="btn3d" data-act="3d" title="Watch it in 3D (drag to rotate)">▶ 3D</button>` : ""}
    </div>
    <div class="body">
      <div class="row"><span class="badge ${c.source}">${c.source}</span><h4>${esc(c.label)}</h4></div>
      <div class="small">${esc(c.rationale)}</div>
      ${c.error ? `<div class="err">Build failed: ${esc(c.error)}</div>` : ""}
      ${c.safety && c.safety !== "ok" ? `<div class="warn">Safety: ${esc(c.safety)}</div>` : ""}
      ${c.match != null ? `<div class="scores">
          <div style="flex:1">blind match ${Math.round(c.match*100)}%<div class="meter"><i style="width:${c.match*100}%"></i></div></div>
          <div style="flex:1">picked from list ${Math.round((c.legibility||0)*100)}%<div class="meter"><i style="width:${(c.legibility||0)*100}%"></i></div></div></div>
        <details><summary>What a blind viewer saw</summary><div class="small">${esc(c.judge_reading)}</div>
          <div class="small"><i>${esc(c.match_reason)}</i></div></details>` : ""}
      <details><summary>Motion ${c.duration_s ? `(${c.duration_s}s)` : ""}${c.sound ? ` · sound: ${esc(c.sound)}` : ""}</summary><code>${esc(what)}</code></details>
      <details><summary>Dials</summary><div class="dials">
        <span>speed</span><input type="range" min="0.5" max="2" step="0.05" value="${d.speed}" data-dial="speed"><span>${d.speed}×</span>
        <span>size</span><input type="range" min="0.4" max="1.5" step="0.05" value="${d.amplitude}" data-dial="amplitude"><span>${d.amplitude}×</span>
      </div><button data-act="dials" style="margin-top:6px">Apply dials</button></details>
      <div class="row"><div class="row stars">${stars}</div><span style="flex:1"></span>
        <button data-act="fit" class="fit ${fb.picked ? "on" : ""}" title="Your pick: does this express the meme well? Click again to unmark.">${fb.picked ? "✓ Good fit" : "Good fit?"}</button></div>
      ${fb.played ? `<div class="small">played on Reachy ${fb.played}×</div>` : ""}
      <textarea data-role="comment" placeholder="What works, what doesn't?">${esc(fb.comment || "")}</textarea>
      <div class="row" style="margin-top:auto">
        <button data-act="comment">Save note</button>
        <button data-act="more">More like this</button>
        ${c.sound ? `<button data-act="sound" title="Hear the sound here">♪</button>` : ""}
        <button data-act="play" class="primary" ${c.move_file ? "" : "disabled"}>▶ Play on Reachy</button>
        <button data-act="save" ${c.move_file ? "" : "disabled"}>${c.saved_as ? "Saved ✓" : "Save"}</button>
      </div>
    </div></div>`;
}

function bindMain() {
  binhStatus();
  $("#saveReading").onclick = () => saveReading(false);
  $("#reread").onclick = () => saveReading(true);
  $("#propose").onclick = () => runRound({mode: "new"});
  $("#improve").onclick = () => runRound({mode: "feedback"});
  ["#nLib", "#nOwn", "#nBinh"].forEach(id => $(id).oninput = e => e.target.dataset.touched = "1");
  $("#rounds").addEventListener("input", e => {
    if (e.target.dataset.role === "comment" && e.target.value.trim()) $("#improve").disabled = false; });
  $("#rounds").oninput = e => { if (e.target.dataset.dial) e.target.nextElementSibling.textContent = e.target.value + "×"; };
  $("#rounds").onclick = onCardClick;
}

function readingEdits() { const out = {}; document.querySelectorAll("textarea[data-k]").forEach(t => out[t.dataset.k] = t.value); return out; }

async function saveReading(reinterpret) {
  const btn = reinterpret ? $("#reread") : $("#saveReading"); btn.disabled = true;
  try { S = await api(`/api/sessions/${S.id}/reading`, {method: "PUT", headers: {"content-type": "application/json"},
          body: JSON.stringify({reading: reinterpret ? null : readingEdits(), notes: $("#notes").value, reinterpret})});
        render(); toast(reinterpret ? "Re-read the meme" : "Saved"); }
  catch (e) { toast(e.message); btn.disabled = false; }
}

function hasFeedback() {
  return S.candidates.some(c => { const fb = c.feedback || {}; return fb.rating || fb.comment || fb.picked || c.saved_as; });
}

async function saveDraftNotes() {  // notes typed on cards but not saved yet become part of the feedback
  const posts = [];
  document.querySelectorAll(".card[data-cid]").forEach(card => {
    const c = S.candidates.find(x => x.id === card.dataset.cid), t = $("textarea", card);
    if (c && t && t.value.trim() && t.value !== ((c.feedback || {}).comment || ""))
      posts.push(post(`/api/sessions/${S.id}/candidates/${c.id}/feedback`, {comment: t.value})
        .then(nc => Object.assign(c, nc)));
  });
  await Promise.all(posts);
  return posts.length;
}

async function runRound(opts) {
  const mix = {library: +$("#nLib").value, own: +$("#nOwn").value, binh: +$("#nBinh").value};
  if (!mix.library && !mix.own && !mix.binh) return toast("Ask for at least one candidate");
  const savedNotes = await saveDraftNotes();
  if (savedNotes) toast(`Saved ${savedNotes} unsaved note${savedNotes > 1 ? "s" : ""} first`);
  // persist reading edits + notes first, so the proposer uses them
  await api(`/api/sessions/${S.id}/reading`, {method: "PUT", headers: {"content-type": "application/json"},
    body: JSON.stringify({reading: readingEdits(), notes: $("#notes").value})});
  const rounds = $("#rounds");
  rounds.insertAdjacentHTML("afterbegin", `<div class="busy" id="busy">Proposing, building and judging… (about 30–60 s)</div>`);
  document.querySelectorAll("button").forEach(b => b.disabled = true);
  try { const res = await post(`/api/sessions/${S.id}/round`, {mix, ...opts}); S = res.session; render(); loadSessions(); loadLearning(); }
  catch (e) { toast(e.message, 6000); render(); }
}

async function onCardClick(e) {
  const btn = e.target.closest("button[data-act]"); if (!btn) return;
  const card = btn.closest(".card"), cid = card.dataset.cid, act = btn.dataset.act;
  const c = S.candidates.find(x => x.id === cid);
  const base = `/api/sessions/${S.id}/candidates/${cid}`;
  const draft = $("textarea", card).value;
  const saved = (c.feedback || {}).comment || "";
  const update = nc => {  // re-render the card, keeping whatever note is in the box *now*
    const live = document.querySelector(`.card[data-cid="${cid}"]`);
    const current = live ? $("textarea", live).value : draft;
    Object.assign(c, nc);
    if (!live) return;
    live.outerHTML = cardHtml(c);
    const fresh = document.querySelector(`.card[data-cid="${cid}"] textarea`);
    if (fresh && current !== ((c.feedback || {}).comment || "")) fresh.value = current;
  };
  try {
    if (act === "rate") {  // a star click also saves the note being typed
      const body = {rating: +btn.dataset.v};
      if (draft.trim() && draft !== saved) body.comment = draft;
      update(await post(`${base}/feedback`, body));
      if (body.comment) toast("Rating and note saved");
    }
    else if (act === "fit") {
      const body = {picked: !(c.feedback || {}).picked};
      if (draft.trim() && draft !== saved) body.comment = draft;
      update(await post(`${base}/feedback`, body));
    }
    else if (act === "comment") { update(await post(`${base}/feedback`, {comment: $("textarea", card).value})); toast("Note saved"); }
    else if (act === "more") {
      const note = $("textarea", card).value;
      if (note && note !== (c.feedback || {}).comment) await post(`${base}/feedback`, {comment: note});
      runRound({mode: "more_like", anchor: cid, notes: note});
    }
    else if (act === "sound") new Audio(`/sound/${c.sound}`).play();
    else if (act === "3d") show3D(c);
    else if (act === "dials") {
      btn.disabled = true; btn.textContent = "Rebuilding…";
      const v = k => +$(`input[data-dial=${k}]`, card).value;
      update(await post(`${base}/dials`, {speed: v("speed"), amplitude: v("amplitude")}));
    }
    else if (act === "play") {
      btn.disabled = true; btn.textContent = "Starting…";
      const r = await post(`${base}/play`, {sound: true});   // answers when the motion starts
      if (r.sound_url) new Audio(r.sound_url).play().catch(() => {});
      btn.textContent = "Playing…";
      await new Promise(res => setTimeout(res, r.duration_s * 1000));
      update(await post(`${base}/feedback`, {played: true})); robotStatus();
    }
    else if (act === "save") {
      const name = prompt("Name this expression", c.label); if (!name) return;
      const meta = await post(`${base}/save`, {name}); update({saved_as: meta.slug});
      toast(`Saved to store/${meta.slug}.json`);
    }
    if (["rate", "comment", "fit", "save"].includes(act)) { loadLearning(); $("#improve").disabled = !hasFeedback(); }
  } catch (err) { toast(err.message, 6000); btn.disabled = false; if (act === "play") btn.textContent = "▶ Play on Reachy"; }
}

// ----- 3D preview (in-browser viewer in a frame) -----
let v3dReady = false, v3dPending = null;
async function show3D(c) {
  const move = await api(`/files/${S.id}/${c.move_file}?v=${Date.now()}`);
  $("#v3dTitle").textContent = `${c.id} · ${c.label}`;
  $("#viewer3d").classList.add("open");
  const frame = $("#v3dFrame");
  if (!frame.src) frame.src = "viewer/index.html";
  if (v3dReady) frame.contentWindow.postMessage({type: "play", move}, location.origin);
  else v3dPending = move;
}
const close3D = () => $("#viewer3d").classList.remove("open");
window.addEventListener("message", e => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.type === "viewer-close") return close3D();
  if (e.data.type !== "viewer-ready") return;
  v3dReady = true;
  if (v3dPending) { $("#v3dFrame").contentWindow.postMessage({type: "play", move: v3dPending}, location.origin); v3dPending = null; }
});
$("#v3dClose").onclick = close3D;
document.addEventListener("keydown", e => { if (e.key === "Escape") close3D(); });

// ----- robot status -----
async function robotStatus() {
  try { const st = await api("/api/robot/status");
    $("#rdot").className = "dot " + (st.ok ? "ok" : "no");
    $("#rtext").textContent = st.ok ? `Reachy ready (motors ${st.motors})` : `Reachy: ${st.reason}`; }
  catch { $("#rdot").className = "dot no"; $("#rtext").textContent = "server error"; }
}
$("#sleepBtn").onclick = async () => { try { await post("/api/robot/sleep"); toast("Reachy is asleep"); robotStatus(); }
                                       catch (e) { toast(e.message); } };
// ----- LLM settings -----
let LLM = null;
async function openLLM() {
  LLM = await api("/api/llm");
  $("#llmPreset").innerHTML = Object.entries(LLM.presets).map(([k, p]) =>
    `<option value="${k}" ${k === LLM.preset ? "selected" : ""}>${esc(p.label)}</option>`).join("");
  fillLLM(true);
  $("#llmResult").textContent = "";
  $("#llmOverrides").textContent = LLM.overrides.length ?
    `Note: config.local.toml sets these roles directly, so they ignore this choice: ${LLM.overrides.join(", ")}` : "";
  $("#llmDlg").showModal();
}
function fillLLM(initial) {
  const k = $("#llmPreset").value, p = LLM.presets[k], same = initial && k === LLM.preset;
  $("#llmHelp").textContent = p.help;
  $("#llmKeyRow").style.display = (p.needs_key || p.key_optional) ? "" : "none";
  $("#llmKey").value = "";
  $("#llmKey").placeholder = p.has_key ? "key saved ✓ (type to replace)" : (p.key_optional ? "optional" : "paste your key");
  $("#llmUrlRow").style.display = p.base_url !== null && p.base_url !== undefined ? "" : "none";
  $("#llmUrl").value = same && LLM.base_url ? LLM.base_url : (p.base_url || "");
  $("#llmMain").value = same && LLM.main_model ? LLM.main_model : p.main_model;
  $("#llmFast").value = same && LLM.fast_model ? LLM.fast_model : p.fast_model;
  $("#llmLoad").style.display = p.list_models ? "" : "none";
  $("#llmModels").innerHTML = ""; $("#llmModelsNote").textContent = "";
  if (p.list_models && (!p.needs_key || p.has_key)) loadModels();
}
function llmBody() {
  const body = {preset: $("#llmPreset").value, main_model: $("#llmMain").value, fast_model: $("#llmFast").value,
                base_url: $("#llmUrl").value};
  if ($("#llmKey").value.trim()) body.api_key = $("#llmKey").value.trim();
  return body;
}
async function loadModels() {
  const k = $("#llmPreset").value;
  if ($("#llmKey").value.trim()) { LLM = await post("/api/llm", llmBody()); }  // key needed to list
  $("#llmModelsNote").textContent = "Loading models…";
  try {
    const r = await api(`/api/llm/models?preset=${k}&base_url=${encodeURIComponent($("#llmUrl").value)}`);
    $("#llmModels").innerHTML = r.models.map(m => `<option value="${esc(m)}">`).join("");
    $("#llmModelsNote").textContent = r.models.length ? `${r.models.length} models available: click a model box to pick one.`
                                                       : "The server listed no models.";
  } catch (e) { $("#llmModelsNote").textContent = e.message; }
}
$("#llmBtn").onclick = openLLM;
$("#llmClose").onclick = () => $("#llmDlg").close();
$("#llmPreset").onchange = () => fillLLM(false);
$("#llmLoad").onclick = loadModels;
$("#llmSave").onclick = async () => {
  try { LLM = await post("/api/llm", llmBody()); $("#llmKey").value = ""; fillLLM(true); toast("LLM settings saved"); }
  catch (e) { toast(e.message, 6000); } };
$("#llmTest").onclick = async () => {
  try {
    LLM = await post("/api/llm", llmBody()); $("#llmKey").value = "";
    $("#llmResult").textContent = "Testing (asks each model about a small red square)…";
    const r = await post("/api/llm/test");
    $("#llmResult").innerHTML = ["main", "fast"].map(t => `<div class="${r[t].ok ? "ok" : "err"}">${r[t].ok ? "✓" : "✗"}
      ${t} model${r[t].model ? ` (${esc(r[t].model)})` : ""}: ${esc(r[t].detail)} · ${r[t].seconds}s</div>`).join("");
  } catch (e) { $("#llmResult").innerHTML = `<div class="err">${esc(e.message)}</div>`; } };

robotStatus(); setInterval(robotStatus, 15000);
loadSessions().then(() => {
  const want = new URLSearchParams(location.search).get("session");  // link straight to a session
  const first = $("#sessions li");
  if (want) openSession(want); else if (first) openSession(first.dataset.id);
  loadLearning(); });
api("/api/llm").then(l => { if (!l.ready) { openLLM().then(() => { $("#llmResult").innerHTML =
  `<div class="warn">${esc(l.problem)}</div>`; }); } }).catch(() => {});
</script>
</body>
