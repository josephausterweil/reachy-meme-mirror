# Defaults. Put your own overrides in config.local.toml (git-ignored), e.g.
#   [user]
#   name = "Sam"
#   [llm.proposer]
#   provider = "anthropic_api"
#   model = "claude-opus-5-5"

[user]
name = ""              # how prompts refer to you ("" = "the user")

[robot]
host = "reachy-mini.local"
sound = "auto"         # where move sounds play: auto | robot | computer | browser | off

# Which LLM to use. Easiest: open the web UI and click "⚙ LLM". Or set it here / in config.local.toml.
# Presets: claude-code (your local `claude` CLI login), anthropic, openai, gemini, openrouter, ollama, lmstudio,
# custom (any OpenAI-compatible server). API keys go in env vars or secrets.local.toml (git-ignored), never here.
[llm]
preset = "claude-code"
main_model = ""        # reads memes + writes expressions ("" = the preset's default)
fast_model = ""        # blind judge, grader, lessons
base_url = ""          # only for presets that talk to a server ("" = the preset's default)

# Experts: override any single role with a full table, e.g. a local model just for proposing:
# [llm.proposer]
# provider = "openai_compatible"     # claude_code | anthropic_api | openai_compatible | command
# base_url = "http://localhost:8000/v1"
# model = "my-local-model"
# Roles: interpreter, proposer, judge, grader, lessons, cataloger.
